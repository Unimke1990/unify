<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Contact</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #afb0ba;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #333;
        }
        form {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            margin: auto;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        select, input[type="checkbox"], button {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            background-color: #28a745;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #218838;
        }
        h2 {
            color: #333;
            text-align: center;
        }
        p {
            background: #fff;
            padding: 10px;
            border-radius: 4px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            margin: 10px auto;
        }
        .navigation {
            text-align: center;
            margin-top: 20px;
        }
        .navigation a {
            margin: 0 10px;
            text-decoration: none;
            color: #007bff;
        }
        .navigation a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1>Random Contact</h1>
    <form action="/contacts/random_contact" method="POST">
        <label for="group_id">Select Group:</label>
        <select name="group_id" id="group_id" required>
            {% for group in groups %}
                <option value="{{ group.id }}">{{ group.name }}</option>
            {% endfor %}
        </select>
        <br><br>
        <label for="allow_repeat">Allow Repeat:</label>
        <input type="checkbox" name="allow_repeat" id="allow_repeat">
        <br><br>
        <button type="submit">Randomize Contact</button>
    </form>

    <!-- Section to display the selected contact details -->
    {% if selected_contact %}
        <h2>Selected Contact</h2>
        <p><strong>Name:</strong> {{ selected_contact.name }}</p>
        <p><strong>Phone:</strong> {{ selected_contact.phone }}</p>
        <p><strong>Email:</strong> {{ selected_contact.email }}</p>
        <p><strong>Last Contacted:</strong> {{ last_contacted }}</p>
    {% endif %}

    <!-- Navigation links -->
    <div class="navigation">
        <a href="/">Go Back Home</a>
        <a href="/contacts">Contacts</a>
    </div>
</body>
</html>
