<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Reminder</title>
</head>
<body>
    <h1>Create Reminder</h1>
    <form action="{{ url_for('reminders.create_reminder') }}" method="POST">
        <label for="title">Title:</label>
        <input type="text" name="title" id="title" required><br>
        <label for="description">Description:</label>
        <textarea name="description" id="description" required></textarea><br>
        <label for="due_date">Due Date:</label>
        <input type="datetime-local" name="due_date" id="due_date" required><br>
        <label for="recurrence_type">Recurrence Type:</label>
        <select name="recurrence_type" id="recurrence_type">
            <option value="">None</option>
            <option value="daily">Daily</option>
            <option value="weekly">Weekly</option>
            <option value="monthly">Monthly</option>
        </select><br>
        <label for="recurrence_frequency">Recurrence Frequency:</label>
        <input type="number" name="recurrence_frequency" id="recurrence_frequency"><br>
        <label for="recurrence_interval">Recurrence Interval:</label>
        <input type="number" name="recurrence_interval" id="recurrence_interval"><br>
        <button type="submit">Create Reminder</button>
    </form>
</body>
</html>
