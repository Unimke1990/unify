<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Reminder</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #b4bdd8;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        form {
            display: flex;
            flex-direction: column;
        }
        label {
            margin-top: 10px;
            color: #555;
        }
        input, textarea, select, button {
            margin-top: 5px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }
        button {
            background-color: #007bff;
            color: #fff;
            border: none;
            cursor: pointer;
            margin-top: 20px;
        }
        button:hover {
            background-color: #0056b3;
        }
        a {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #007bff;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Create Reminder</h1>
        <form action="{{ url_for('reminders.create_reminder') }}" method="POST">
            <label for="title">Title:</label>
            <input type="text" name="title" id="title" required>
            <label for="description">Description:</label>
            <textarea name="description" id="description" required></textarea>
            <label for="due_date">Due Date:</label>
            <input type="datetime-local" name="due_date" id="due_date" required>
            <label for="recurrence_type">Recurrence Type:</label>
            <select name="recurrence_type" id="recurrence_type">
                <option value="">None</option>
                <option value="daily">Daily</option>
                <option value="weekly">Weekly</option>
                <option value="monthly">Monthly</option>
            </select>
            <label for="recurrence_frequency">Recurrence Frequency:</label>
            <input type="number" name="recurrence_frequency" id="recurrence_frequency">
            <label for="recurrence_interval">Recurrence Interval:</label>
            <input type="number" name="recurrence_interval" id="recurrence_interval">
            <button type="submit">Create Reminder</button>
        </form>
        <a href="{{ url_for('reminders.view_reminders') }}">View Reminders</a>
    </div>
</body>
</html>
