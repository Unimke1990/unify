{% extends "base.html" %}
{% block title %}Sign Up{% endblock %}

{% block content %}

<h2 style="text-align: center; color: #4CAF50;">Sign Up</h2>

{% with messages = get_flashed_messages() %}
    {% if messages %}
    <ul style="list-style-type: none; padding: 0;">
        {% for message in messages %}
        <li style="color: rgb(22, 249, 86); text-align: center;">{{ message }}</li>
        {% endfor %}
    </ul>
    {% endif %}
{% endwith %}

<form action="{{ url_for('auth.signup') }}" method="POST" style="max-width: 400px; margin: auto; padding: 20px; border: 1px solid #ccc; border-radius: 10px; background-color: #f9f9f9;">
    <div style="margin-bottom: 15px;">
        <input type="text" name="name" placeholder="Name" style="width: 100%; padding: 10px; margin: 5px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px;">
    </div>
    <div style="margin-bottom: 15px;">
        <input type="text" name="username" placeholder="Username" style="width: 100%; padding: 10px; margin: 5px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px;">
    </div>
    <div style="margin-bottom: 15px;">
        <input type="password" name="password" placeholder="Password" style="width: 100%; padding: 10px; margin: 5px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px;">
    </div>
    <div style="margin-bottom: 15px;">
        <input type="text" name="email" placeholder="Email" style="width: 100%; padding: 10px; margin: 5px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px;">
    </div>
    <div style="text-align: center;">
        <input type="submit" value="Sign Up" style="background-color: #4CAF50; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer;">
    </div>
</form>

{% endblock %}
