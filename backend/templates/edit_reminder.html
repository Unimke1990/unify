<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Reminder</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px;
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        form {
            display: flex;
            flex-direction: column;
        }
        label {
            margin-top: 15px;
            color: #555;
            font-weight: 500;
        }
        input, textarea, select, button {
            margin-top: 8px;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        input:focus, textarea:focus, select:focus {
            border-color: #007bff;
            outline: none;
        }
        button {
            background-color: #007bff;
            color: #fff;
            border: none;
            cursor: pointer;
            margin-top: 25px;
            font-weight: 500;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #0056b3;
        }
        .button {
            display: inline-block;
            margin-top: 20px;
            text-align: center;
            padding: 10px 20px;
            background-color: #6c757d;
            color: #fff;
            border-radius: 5px;
            text-decoration: none;
            transition: background-color 0.3s;
        }
        .button:hover {
            background-color: #5a6268;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Edit Reminder</h1>
        <form action="{{ url_for('reminders.edit_reminder', id=reminder.id) }}" method="POST">
            <label for="title">Title:</label>
            <input type="text" name="title" id="title" value="{{ reminder.title }}" required>
            <label for="description">Description:</label>
            <textarea name="description" id="description" required>{{ reminder.description }}</textarea>
            <label for="due_date">Due Date:</label>
            <input type="datetime-local" name="due_date" id="due_date" value="{{ reminder.due_date.strftime('%Y-%m-%dT%H:%M:%S') }}" required>
            <label for="recurrence_type">Recurrence Type:</label>
            <select name="recurrence_type" id="recurrence_type">
                <option value="" {% if reminder.recurrence_type == '' %}selected{% endif %}>None</option>
                <option value="daily" {% if reminder.recurrence_type == 'daily' %}selected{% endif %}>Daily</option>
                <option value="weekly" {% if reminder.recurrence_type == 'weekly' %}selected{% endif %}>Weekly</option>
                <option value="monthly" {% if reminder.recurrence_type == 'monthly' %}selected{% endif %}>Monthly</option>
            </select>
            <label for="recurrence_frequency">Recurrence Frequency:</label>
            <input type="number" name="recurrence_frequency" id="recurrence_frequency" value="{{ reminder.recurrence_frequency }}">
            <label for="recurrence_interval">Recurrence Interval:</label>
            <input type="number" name="recurrence_interval" id="recurrence_interval" value="{{ reminder.recurrence_interval }}">
            <button type="submit">Update Reminder</button>
        </form>
        <a href="{{ url_for('index') }}" class="button">Back Home</a>
    </div>
</body>
</html>
