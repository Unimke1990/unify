{% extends "base.html" %}
{% block title %}Contacts Page{% endblock %}

{% block content %}
<h1>Contacts list</h1>

{% for contact in contacts %}
    {% if contact %}
        <p>{{ contact.name }}</p><br>
        <p>{{ contact.phone }}</p><br>
        <p>{{ contact.email }}</p><br>

        <a href="{{ url_for('delete_contact', id=contact.id) }}">Delete</a>
        <a href="{{ url_for('edit_contact', id=contact.id) }}">Edit</a>
    {% endif %}
{% endfor %}


{% endblock %}
