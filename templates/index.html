{% extends "base.html" %}

{% block content %}

    <h1 style="color: #2c3e50; text-align: center; font-family: Arial, sans-serif;">Uniffy</h1>
    <p style="color: #34495e; text-align: center; font-family: Arial, sans-serif;">Care. Unite. Connect</p>

    {% if current_user.is_authenticated %}
        <h3 style="color: #27ae60; text-align: center; font-family: Arial, sans-serif;">Hello {{ current_user.username }}, you are logged in to Unify.</h3>
        <div style="text-align: center;">
            <a href="{{ url_for('update_profile') }}" style="margin: 10px; padding: 10px 20px; background-color: #3498db; color: white; text-decoration: none; border-radius: 5px;">Update Profile</a>
            <a href="{{ url_for('add_contact') }}" style="margin: 10px; padding: 10px 20px; background-color: #3498db; color: white; text-decoration: none; border-radius: 5px;">Add Contact</a>
            <a href="{{ url_for('contacts') }}" style="margin: 10px; padding: 10px 20px; background-color: #3498db; color: white; text-decoration: none; border-radius: 5px;">Contacts</a>
            <a href="{{ url_for('logout') }}" style="margin: 10px; padding: 10px 20px; background-color: #e74c3c; color: white; text-decoration: none; border-radius: 5px;">Logout</a>
        </div>
    {% else %}
        <h3 style="color: #e67e22; text-align: center; font-family: Arial, sans-serif;">Hello, guest!</h3>
        <div style="text-align: center;">
            <a href="{{ url_for('signup') }}" style="margin: 10px; padding: 10px 20px; background-color: #3498db; color: white; text-decoration: none; border-radius: 5px;">Signup</a>
            <a href="{{ url_for('login') }}" style="margin: 10px; padding: 10px 20px; background-color: #3498db; color: white; text-decoration: none; border-radius: 5px;">Login</a>
        </div>
    {% endif %}

{% endblock %}
