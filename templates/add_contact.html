{% extends 'base.html' %}

{% block content %}
    <h1 style="text-align: center; color: #4CAF50;">Add Contact</h1>
  
    {% with messages = get_flashed_messages() %}
        {% if messages %}
        <ul style="list-style-type: none; padding: 0;">
            {% for message in messages %}
                <li style="color: rgb(246, 15, 15); text-align: center;">{{ message }}</li>
            {% endfor %}
        </ul>
        {% endif %}
    {% endwith %}

    <form action="{{ url_for('add_contact') }}" method="POST" style="max-width: 400px; margin: auto; padding: 20px; border: 1px solid #ccc; border-radius: 10px; box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);">
        <input type="text" name="name" placeholder="Name" required style="width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px;"><br>
        <input type="text" name="phone" placeholder="Phone" required style="width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px;"><br>
        <input type="text" name="email" placeholder="Email" required style="width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px;"><br>
        <input type="text" name="group_name" placeholder="Group Name" style="width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px;"><br>
        <input type="submit" value="Add Contact" style="width: 100%; padding: 10px; background-color: #4CAF50; color: white; border: none; border-radius: 5px; cursor: pointer;">
    </form>

    <div style="text-align: center; margin-top: 20px;">
        <a href="{{ url_for('contacts') }}" style="margin-right: 10px; color: #4CAF50; text-decoration: none;">View Contacts</a>
        <a href="{{ url_for('index') }}" style="color: #4CAF50; text-decoration: none;">Back to Home</a>
    </div>

{% endblock %}
